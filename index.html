<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bubble Buster</title>
    <meta name="description" content="Pop as many bubbles as you can in 60 seconds. Small, fast bubbles score more." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Bubble Buster" />
    <meta property="og:title" content="Bubble Buster" />
    <meta property="og:description" content="Pop as many bubbles as you can in 60 seconds." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/fredoka-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="Bubble field. Tap or click bubbles to pop them."></canvas>

    <header class="hud" id="hud" hidden>
      <div class="hud__stat">
        <span class="hud__label">Score</span>
        <span class="hud__value" id="score">0</span>
      </div>
      <div class="hud__right">
        <div class="hud__stat hud__stat--time">
          <span class="hud__label">Time</span>
          <span class="hud__value" id="time">60</span>
        </div>
        <button class="icon-btn" id="pause-btn" type="button" aria-label="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
        </button>
        <button class="icon-btn sound-btn" type="button" aria-label="Mute sound" aria-pressed="false">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="stroke" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" /></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="stroke" d="M16 9.5l5 5M21 9.5l-5 5" /></svg>
        </button>
      </div>
      <div class="hud__bar" aria-hidden="true"><span id="time-bar"></span></div>
    </header>

    <div class="screen" id="start-screen" role="dialog" aria-labelledby="start-title">
      <div class="panel">
        <p class="eyebrow">A 60 second game</p>
        <h1 class="title" id="start-title">Bubble<br />Buster</h1>
        <p class="lede">Pop as many bubbles as you can before the clock runs out.</p>
        <ul class="legend" aria-label="Scoring">
          <li><span class="dot dot--lg" aria-hidden="true"></span><span><strong>Big and slow</strong> from 10 pts</span></li>
          <li><span class="dot dot--sm" aria-hidden="true"></span><span><strong>Small and fast</strong> up to 80 pts</span></li>
        </ul>
        <button class="btn" id="start-btn" type="button">Start game</button>
        <p class="best" id="start-best" hidden></p>
      </div>
      <button class="icon-btn sound-btn corner-btn" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="stroke" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" /></svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path class="stroke" d="M16 9.5l5 5M21 9.5l-5 5" /></svg>
      </button>
    </div>

    <div class="screen" id="pause-screen" role="dialog" aria-labelledby="pause-title" hidden>
      <div class="panel">
        <h2 class="title title--md" id="pause-title">Paused</h2>
        <p class="lede">The clock is stopped. Pick up where you left off.</p>
        <button class="btn" id="resume-btn" type="button">Resume</button>
        <button class="btn btn--ghost" id="restart-btn" type="button">Restart</button>
      </div>
    </div>

    <div class="screen" id="over-screen" role="dialog" aria-labelledby="over-title" hidden>
      <div class="panel">
        <p class="eyebrow">Time's up</p>
        <h2 class="visually-hidden" id="over-title">Game over</h2>
        <p class="final" aria-live="polite"><span id="final-score">0</span><span class="final__unit">pts</span></p>
        <p class="badge" id="new-best" hidden>New best</p>
        <dl class="stats">
          <div><dt>Popped</dt><dd id="stat-popped">0</dd></div>
          <div><dt>Accuracy</dt><dd id="stat-accuracy">0%</dd></div>
          <div><dt>Best</dt><dd id="stat-best">0</dd></div>
        </dl>
        <button class="btn" id="again-btn" type="button">Play again</button>
      </div>
    </div>

    <script src="game.js" defer></script>
  </body>
</html>
